[project]
name = "apizit-flask-security-api"
version = "0.1.0"
description = "Bounded standalone adversarial API fixtures for APIZIT dev qualification."
requires-python = ">=3.12,<3.13"
license = "MIT"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
